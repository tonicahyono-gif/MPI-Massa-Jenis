<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rumus Massa Jenis</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      padding: 20px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #a0e4ff;
      text-align: center;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(160, 228, 255, 0.5);
    }

    .rumus-box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(160, 228, 255, 0.3);
      border-radius: 14px;
      padding: 12px 30px;
      margin-bottom: 40px;
      text-align: center;
    }

    .rumus-box p {
      font-size: 1.1rem;
      color: #ffe680;
      letter-spacing: 1px;
    }

    .rumus-box span {
      font-size: 1.4rem;
      font-weight: bold;
      color: #fff;
    }

    /* Container 3 slider */
    .sliders-container {
      display: flex;
      gap: 50px;
      align-items: flex-end;
      justify-content: center;
      flex-wrap: wrap;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* Nilai di atas slider */
    .value-display {
      font-size: 1.4rem;
      font-weight: bold;
      min-width: 80px;
      text-align: center;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
    }

    .unit-display {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.5);
      margin-top: 2px;
    }

    /* Track wrapper vertical */
    .track-wrapper {
      position: relative;
      width: 60px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Slider vertikal */
    input[type="range"][orient="vertical"],
    input[type="range"].vertical {
      writing-mode: vertical-lr;
      direction: rtl;
      appearance: slider-vertical;
      -webkit-appearance: slider-vertical;
      width: 36px;
      height: 220px;
      cursor: pointer;
      outline: none;
    }

    /* Firefox fallback */
    @supports not (appearance: slider-vertical) {
      input[type="range"].vertical {
        writing-mode: vertical-lr;
        direction: rtl;
        width: 36px;
        height: 220px;
      }
    }

    /* Warna masing-masing slider */
    #massaSlider   { accent-color: #ff6b9d; }
    #volumeSlider  { accent-color: #6bffb8; }
    #densitySlider { accent-color: #ffd96b; }

    /* Label nama */
    .slider-label {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    #massaSlider   ~ .slider-label,
    .massa-label   { color: #ff6b9d; }
    .volume-label  { color: #6bffb8; }
    .density-label { color: #ffd96b; }

    /* Bar visual di belakang slider */
    .bar-fill {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      border-radius: 6px;
      transition: height 0.1s;
      pointer-events: none;
      z-index: 0;
    }

    /* Formula highlight */
    .formula-display {
      margin-top: 40px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .formula-card {
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      padding: 14px 22px;
      text-align: center;
      min-width: 160px;
    }

    .formula-card .label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .formula-card .expr {
      font-size: 1rem;
      color: #ffe680;
    }

    .formula-card .expr span {
      font-weight: bold;
      color: #fff;
    }

    /* Animasi glow aktif */
    .active-glow {
      box-shadow: 0 0 18px rgba(255, 220, 100, 0.4);
      border-color: rgba(255, 220, 100, 0.5) !important;
    }
  </style>
</head>
<body>

  <h1>⚗️ Rumus Massa Jenis</h1>

  <div class="rumus-box">
    <p>Rumus Dasar:</p>
    <span>ρ = m ÷ V</span>
    <p style="font-size:0.8rem; color:rgba(255,255,255,0.45); margin-top:4px;">
      ρ = Massa Jenis &nbsp;|&nbsp; m = Massa &nbsp;|&nbsp; V = Volume
    </p>
  </div>

  <div class="sliders-container">

    <!-- Massa -->
    <div class="slider-group">
      <div class="value-display" id="massaVal" style="color:#ff6b9d;">
        100
        <div class="unit-display">gram (g)</div>
      </div>
      <div class="track-wrapper">
        <input type="range" class="vertical" id="massaSlider"
               min="1" max="1000" value="100" step="1"
               oninput="updateFromMassa()">
      </div>
      <div class="slider-label massa-label">Massa</div>
    </div>

    <!-- Volume -->
    <div class="slider-group">
      <div class="value-display" id="volumeVal" style="color:#6bffb8;">
        50
        <div class="unit-display">cm³</div>
      </div>
      <div class="track-wrapper">
        <input type="range" class="vertical" id="volumeSlider"
               min="1" max="1000" value="50" step="1"
               oninput="updateFromVolume()">
      </div>
      <div class="slider-label volume-label">Volume</div>
    </div>

    <!-- Massa Jenis -->
    <div class="slider-group">
      <div class="value-display" id="densityVal" style="color:#ffd96b;">
        2.00
        <div class="unit-display">g/cm³</div>
      </div>
      <div class="track-wrapper">
        <input type="range" class="vertical" id="densitySlider"
               min="0.01" max="20" value="2" step="0.01"
               oninput="updateFromDensity()">
      </div>
      <div class="slider-label density-label">Massa Jenis</div>
    </div>

  </div>

  <!-- Formula cards -->
  <div class="formula-display">
    <div class="formula-card" id="card1">
      <div class="label">Massa Jenis (ρ)</div>
      <div class="expr">ρ = <span id="fc_m">100</span> ÷ <span id="fc_v">50</span> = <span id="fc_d">2.00</span> g/cm³</div>
    </div>
    <div class="formula-card" id="card2">
      <div class="label">Massa (m)</div>
      <div class="expr">m = ρ × V = <span id="fc_dv">2.00 × 50</span> = <span id="fc_m2">100</span> g</div>
    </div>
    <div class="formula-card" id="card3">
      <div class="label">Volume (V)</div>
      <div class="expr">V = m ÷ ρ = <span id="fc_md">100 ÷ 2.00</span> = <span id="fc_v2">50.00</span> cm³</div>
    </div>
  </div>

  <script>
    const massaSlider   = document.getElementById('massaSlider');
    const volumeSlider  = document.getElementById('volumeSlider');
    const densitySlider = document.getElementById('densitySlider');

    const massaVal   = document.getElementById('massaVal');
    const volumeVal  = document.getElementById('volumeVal');
    const densityVal = document.getElementById('densityVal');

    function fmt(val, dec = 2) {
      return parseFloat(val).toFixed(dec);
    }

    function updateCards(m, v, d) {
      document.getElementById('fc_m').textContent  = fmt(m, 0);
      document.getElementById('fc_v').textContent  = fmt(v, 0);
      document.getElementById('fc_d').textContent  = fmt(d, 2);
      document.getElementById('fc_dv').textContent = `${fmt(d,2)} × ${fmt(v,0)}`;
      document.getElementById('fc_m2').textContent = fmt(m, 0);
      document.getElementById('fc_md').textContent = `${fmt(m,0)} ÷ ${fmt(d,2)}`;
      document.getElementById('fc_v2').textContent = fmt(v, 2);
    }

    function setMassaDisplay(v) {
      massaVal.innerHTML = `${fmt(v, 0)}<div class="unit-display">gram (g)</div>`;
    }
    function setVolumeDisplay(v) {
      volumeVal.innerHTML = `${fmt(v, 0)}<div class="unit-display">cm³</div>`;
    }
    function setDensityDisplay(v) {
      densityVal.innerHTML = `${fmt(v, 2)}<div class="unit-display">g/cm³</div>`;
    }

    // Saat Massa digeser → hitung Massa Jenis baru
    function updateFromMassa() {
      const m = parseFloat(massaSlider.value);
      const v = parseFloat(volumeSlider.value);
      const d = m / v;

      setMassaDisplay(m);
      setDensityDisplay(d);

      // Update density slider (clamp ke range)
      densitySlider.value = Math.min(20, Math.max(0.01, d));

      updateCards(m, v, d);
    }

    // Saat Volume digeser → hitung Massa Jenis baru
    function updateFromVolume() {
      const m = parseFloat(massaSlider.value);
      const v = parseFloat(volumeSlider.value);
      const d = m / v;

      setVolumeDisplay(v);
      setDensityDisplay(d);

      densitySlider.value = Math.min(20, Math.max(0.01, d));

      updateCards(m, v, d);
    }

    // Saat Massa Jenis digeser → hitung Massa baru (Volume tetap)
    function updateFromDensity() {
      const d = parseFloat(densitySlider.value);
      const v = parseFloat(volumeSlider.value);
      const m = d * v;

      setDensityDisplay(d);
      setMassaDisplay(m);

      massaSlider.value = Math.min(1000, Math.max(1, m));

      updateCards(m, v, d);
    }

    // Inisialisasi awal
    updateFromMassa();
  </script>

</body>
</html>
